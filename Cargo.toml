[package]
name = "nullgate-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Typed asynchronous Nullgate protection generation and profiling APIs"
readme = "README.md"
documentation = "https://docs.nullgate.club"
repository = "https://github.com/nullgate-club/nullgate-sdk-rust"
keywords = ["nullgate", "sdk", "akamai", "threatmetrix"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**/*.rs", "examples/*.rs", "tests/**/*.rs", "Cargo.toml", "Cargo.lock", "Makefile", "README.md"]

[dependencies]
async-http-proxy = { version = "1.2.5", features = ["runtime-tokio", "basic-auth"] }
async-socks5 = "0.6.0"
async-trait = "0.1.89"
base64 = "0.22.1"
futures-util = { version = "0.3.31", features = ["sink"] }
html5gum = "0.9.0"
percent-encoding = "2.3.2"
regex = "1.12.2"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "http2", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", default-features = false, features = ["time", "macros", "rt", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
turn = "=0.17.2"
webrtc-util = { version = "=0.17.1", default-features = false, features = ["conn"] }
webpki-roots = "1"
url = "2.5.8"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
wreq = { version = "=0.16.1", features = ["cookies", "gzip", "brotli", "zstd", "deflate", "socks"] }
wreq-util = "=0.2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[[example]]
name = "target"
path = "examples/target.rs"
