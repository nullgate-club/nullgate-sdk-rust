[package]
name = "nullgate-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Typed asynchronous clients for Nullgate protection generation APIs"
readme = "README.md"
documentation = "https://docs.nullgate.club"
repository = "https://github.com/nullgate-club/nullgate-sdk-rust"
keywords = ["nullgate", "sdk", "akamai"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**/*.rs", "examples/*.rs", "tests/**/*.rs", "Cargo.toml", "Cargo.lock", "Makefile", "README.md"]

[dependencies]
html5gum = "0.9.0"
percent-encoding = "2.3.2"
regex = "1.12.2"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "http2", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", default-features = false, features = ["time"] }
url = "2.5.8"
uuid = "1.18.1"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
uuid = { version = "1.18.1", features = ["v4"] }
wreq = { version = "=0.16.1", features = ["cookies", "gzip", "brotli", "zstd", "deflate", "socks"] }
wreq-util = "=0.2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[[example]]
name = "target"
path = "examples/target.rs"
