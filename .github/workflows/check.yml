name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - name: Install target example build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake libclang-dev pkg-config
      - run: make setup
      - run: make check
